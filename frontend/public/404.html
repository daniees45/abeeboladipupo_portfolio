<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abeeb Oladipupo | Portfolio</title>
    <script>
      // Single Page App redirect for static hosts
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var target = '/?p=' + encodeURIComponent(path + search + hash);
      window.location.replace(target);
    </script>
  </head>
  <body style="background:#020617;color:#f8fafc;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <p>Redirecting to Abeeb Oladipupo Portfolio...</p>
  </body>
</html>
