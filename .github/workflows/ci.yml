name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint Static Analysis
        working-directory: frontend
        run: npm run lint

      - name: Run TypeScript & Vite Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend Compilation & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'

      - name: Make Maven Wrapper Executable
        run: chmod +x backend/abeeboladipupo_portfolio/mvnw

      - name: Run Backend Tests
        working-directory: backend/abeeboladipupo_portfolio
        run: ./mvnw clean test
